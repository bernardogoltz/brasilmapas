apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: geo
    uid: geo-pg
    type: grafana-postgresql-datasource
    url: postgis:5432
    user: monitor
    secureJsonData:
      password: ${MONITOR_PASSWORD}
    jsonData:
      database: geo
      sslmode: disable
      postgresVersion: 1800
