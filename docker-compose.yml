name: geo

x-airflow: &airflow
  build: ./airflow
  image: geo-airflow:3.3.2
  profiles: [airflow]
  user: "${AIRFLOW_UID:-1000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgis:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-troque-em-producao}
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: 30
    AIRFLOW_CONN_GEO_LOADER: postgresql://loader:${LOADER_PASSWORD}@postgis:5432/geo
    GEO_DATA_DIR: /opt/airflow/data
    DBT_HOST: postgis
    DBT_PORT: 5432
    TRANSFORMER_PASSWORD: ${TRANSFORMER_PASSWORD}
    PYTHONPATH: /opt/airflow/include
  volumes:
    - ./airflow/dags:/opt/airflow/dags:z
    - ./airflow/include:/opt/airflow/include:z
    - ./data:/opt/airflow/data:z
    - ./dbt:/opt/airflow/dbt:z
  depends_on:
    postgis:
      condition: service_healthy

services:
  postgis:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      LOADER_PASSWORD: ${LOADER_PASSWORD}
      TRANSFORMER_PASSWORD: ${TRANSFORMER_PASSWORD}
      API_READER_PASSWORD: ${API_READER_PASSWORD}
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d geo"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow
    command: ["bash", "-c", "airflow db migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    restart: unless-stopped
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on: &depois-do-init
      postgis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8974/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    environment:
      <<: *airflow-env
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
    depends_on: *depois-do-init

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    restart: unless-stopped
    depends_on: *depois-do-init

  airflow-triggerer:
    <<: *airflow
    command: triggerer
    restart: unless-stopped
    depends_on: *depois-do-init

volumes:
  pgdata:
