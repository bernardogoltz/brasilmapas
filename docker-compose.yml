name: geo

x-airflow: &airflow
  build: ./airflow
  image: geo-airflow:3.3.2
  profiles: [airflow]
  user: "${AIRFLOW_UID:-1000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgis:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-troque-em-producao}
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: 30
    AIRFLOW_CONN_GEO_LOADER: postgresql://loader:${LOADER_PASSWORD}@postgis:5432/geo
    GEO_DATA_DIR: /opt/airflow/data
    DBT_HOST: postgis
    DBT_PORT: 5432
    TRANSFORMER_PASSWORD: ${TRANSFORMER_PASSWORD}
    PYTHONPATH: /opt/airflow/include
    # métricas → statsd-exporter (profile obs); sem ele os pacotes UDP só se perdem
    AIRFLOW__METRICS__STATSD_ON: "True"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: 9125
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
  volumes:
    - ./airflow/dags:/opt/airflow/dags:z
    - ./airflow/include:/opt/airflow/include:z
    - ./data:/opt/airflow/data:z
    - ./dbt:/opt/airflow/dbt:z
  depends_on:
    postgis:
      condition: service_healthy

services:
  postgis:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      LOADER_PASSWORD: ${LOADER_PASSWORD}
      TRANSFORMER_PASSWORD: ${TRANSFORMER_PASSWORD}
      API_READER_PASSWORD: ${API_READER_PASSWORD}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:-monitor}
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d geo"]
      interval: 5s
      timeout: 5s
      retries: 20

  martin:
    image: ghcr.io/maplibre/martin:1.16.0
    profiles: [core]
    restart: unless-stopped
    command: ["--config", "/config/martin.yaml"]
    environment:
      DATABASE_URL: postgresql://api_reader:${API_READER_PASSWORD}@postgis:5432/geo
    ports:
      - "${MARTIN_PORT:-3001}:3000"
    volumes:
      - ./tiles/martin.yaml:/config/martin.yaml:ro,z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgis:
        condition: service_healthy

  airflow-init:
    <<: *airflow
    command: ["bash", "-c", "airflow db migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    restart: unless-stopped
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on: &depois-do-init
      postgis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8974/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    environment:
      <<: *airflow-env
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
    depends_on: *depois-do-init

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    restart: unless-stopped
    depends_on: *depois-do-init

  airflow-triggerer:
    <<: *airflow
    command: triggerer
    restart: unless-stopped
    depends_on: *depois-do-init

  statsd-exporter:
    image: prom/statsd-exporter:v0.28.0
    profiles: [obs]
    restart: unless-stopped
    command: ["--statsd.mapping-config=/config/mapping.yml"]
    ports:
      - "${STATSD_EXPORTER_PORT:-9102}:9102"
    volumes:
      - ./infra/statsd/mapping.yml:/config/mapping.yml:ro,z

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.18.1
    profiles: [obs]
    restart: unless-stopped
    command: ["--collector.stat_statements"]
    environment:
      DATA_SOURCE_URI: postgis:5432/geo?sslmode=disable
      DATA_SOURCE_USER: monitor
      DATA_SOURCE_PASS: ${MONITOR_PASSWORD:-monitor}
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    depends_on:
      postgis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: [obs]
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - promdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:13.3.0
    profiles: [obs]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/geo-pipeline.json
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:-monitor}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  pgdata:
  promdata:
