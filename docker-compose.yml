name: geo

services:
  postgis:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      LOADER_PASSWORD: ${LOADER_PASSWORD}
      TRANSFORMER_PASSWORD: ${TRANSFORMER_PASSWORD}
      API_READER_PASSWORD: ${API_READER_PASSWORD}
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d geo"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
