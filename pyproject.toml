[project]
name = "geo"
version = "0.1.0"
description = "Pipeline de malhas territoriais do IBGE"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "lonboard>=0.17.0",
    "marimo>=0.25.2",
    "pyarrow>=26.0.0",
    "psycopg[binary]>=3.2",
    "pyogrio>=0.13.0",
    "shapely>=2.2.0",
]

[project.scripts]
geoibge = "geoibge.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "geoibge"

[dependency-groups]
dev = [
    "dbt-core>=1.12.6",
    "dbt-postgres>=1.11.0",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["airflow/include"]
